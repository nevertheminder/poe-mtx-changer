name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The goal or problem, not only the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How it could work in the app, if you have one in mind.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Out of scope: anything that gives a gameplay advantage, unlocks purchases, makes swapped cosmetics visible to
        other players, or touches the running game process, memory or network traffic.
