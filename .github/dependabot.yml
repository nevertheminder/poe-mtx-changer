version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions of Microsoft.Extensions.* follow .NET releases; move with the .NET version.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
